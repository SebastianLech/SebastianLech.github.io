project:
  type: website
  output-dir: _site

website:
  title: "Sebastian Lech"
  description: "Notes on probability, mathematics, and quantitative finance."
  favicon: assets/favicon.ico

  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Notes"
        menu:
          - text: "Probability Theory"
            href: notes/probability/index.qmd
      - text: "Articles"
        href: articles/index.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/SebastianLech
        aria-label: GitHub

  page-footer:
    center: |
      Sebastian Lech &nbsp;·&nbsp;
      [GitHub](https://github.com/SebastianLech)

  search: true

  sidebar: false

format:
  html:
    theme:
      light: flatly
      dark: darkly
    mainfont: "Georgia, serif"
    monofont: "Fira Code, monospace"
    highlight-style: github
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    number-sections: false
    smooth-scroll: true
    html-math-method: katex
    code-fold: true
    code-tools: true
    fig-align: center

execute:
  freeze: auto        # re-execute only when source changes
  cache: true
  echo: true
  warning: false

bibliography: references.bib
